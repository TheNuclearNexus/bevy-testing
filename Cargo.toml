[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
bevy_ecs_ldtk = "0.14.0"
bevy_ecs_tilemap = "0.18.1"
bevy-inspector-egui = { version = "0.36.0", optional = true }
bevy_rapier2d = { version = "0.34.0" }

egui_dock = {
  git = "https://github.com/Avarel/egui_dock",
  branch = "egui_0.33",
  optional = true
}
transform-gizmo-bevy = {
  git = "https://github.com/taboky-dev/transform-gizmo",
  branch = "bevy-0.18",
  optional = true
}

[features]
dev = [
  "bevy-inspector-egui",
  "bevy_rapier2d/debug-render-2d",
  "bevy/dynamic_linking",
  "bevy/file_watcher",
  "egui_dock",
  "transform-gizmo-bevy"
]

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
