[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
bevy_ecs_ldtk = "0.14.0"
bevy-inspector-egui = "0.36.0"
bevy_rapier2d = "0.34.0"

[dev-dependencies]
bevy_rapier2d = { version = "0.34.0", features = ["debug-render-2d"] }

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
